<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Empanadas Congeladas</title>
<style>
body{font-family:Arial,sans-serif;background:#fff8ef;margin:0;padding:20px;color:#333}
.container{max-width:560px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 4px 18px #0001}
h1{text-align:center;color:#6a5347;margin-top:0}
label{font-weight:bold;display:block;margin-top:16px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #ddd;border-radius:10px;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:bold;margin-top:18px;cursor:pointer}
.primary{background:#a4897a;color:white}.whatsapp{background:#25d366;color:white}.secondary{background:#eee;color:#333}
.hidden{display:none}.result{margin-top:18px;padding:15px;background:#fff3df;border-radius:12px}
.small{font-size:13px;color:#666;line-height:1.45;margin-top:18px}
.dozen-box{margin-top:12px;padding:14px;background:#faf5ed;border-radius:10px}.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.remove-item{width:auto;margin:0;padding:8px 12px;background:#eee;color:#333;font-size:14px}
.variety-choice{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 11px;background:#fff;border:1px solid #eadbc9;border-radius:10px}
.variety-choice svg{width:42px;height:34px;flex:none}
.variety-choice span{font-size:14px;color:#65432d}

</style>
</head>
<body>
<div class="container">
<h1>Empanadas  Congeladas</h1>

<label>👤 Nombre</label>
<input id="name" type="text" placeholder="Tu nombre">

<label>🚚 ¿Cómo querés recibir tu pedido?</label>
<select id="deliveryMode">
<option value="delivery">🚚 Con envío</option>
<option value="pickup">🏠 Sin envío / Retiro</option>
</select>

<div id="addressBox">
<label>📍 Dirección de entrega</label>
<input id="address" type="text" placeholder="Calle, número, barrio, ciudad">
</div>

<label> Armá tu pedido: Podés combinar variedades</label>
<div id="orderItems"></div>
<button type="button" class="secondary" onclick="addItem()">➕ Agregar otra variedad</button>

<label>📝 Comentarios o aclaraciones</label>
<textarea id="comments" placeholder="Ej.: 2 docenas sin pasas y 1 docena con pasas. O cualquier otra aclaración del pedido."></textarea>

<button class="primary" onclick="calculateOrder()">🚗 Calcular pedido</button>
<div id="result" class="result hidden"></div>
<button id="whatsappBtn" class="whatsapp hidden" onclick="sendWhatsApp()">📲 Enviar pedido por WhatsApp</button>
<button class="secondary" onclick="newOrder()">➕ Nuevo pedido</button>

<div class="small"><strong>Precios:</strong> Criollas: media docena $9.000 / docena $18.000. Árabes: media docena $8.000 / docena $16.000.<br>
<strong>🚚 Costo de envío:</strong> $1.000 por cada 5 km de recorrido en vehículo.<br>
🏠 Si elegís “Sin envío / Retiro”, no se solicita dirección ni se cobra envío.
</div>
</div>

<script>
const ORIGIN="De La Aguada 10356, Villa Warcalde, Córdoba, Argentina";
let lastOrder=null;
const money=n=>"$"+n.toLocaleString("es-AR");
const prices={
 criolla:{half:9000,dozen:18000,onehalf:27000},
 arabic:{half:8000,dozen:16000,onehalf:24000}
};
const presentationNames={half:"Media docena",dozen:"Docena",onehalf:"Docena y media"};
const typeText=v=>v==="arabic"?"árabes":v==="sweet"?"criollas dulces":"criollas saladas";
const raisinText=v=>v==="with"?"con pasas":"sin pasas";
let itemCounter=0;

document.getElementById("deliveryMode").addEventListener("change",toggleDelivery);
function toggleDelivery(){
 const delivery=document.getElementById("deliveryMode").value==="delivery";
 document.getElementById("addressBox").classList.toggle("hidden",!delivery);
}
function addItem(){
 const id=++itemCounter;
 const box=document.createElement("div");
 box.className="dozen-box"; box.dataset.itemId=id;
 box.innerHTML=`
  <div class="item-head"><strong>Variedad ${id}</strong><button type="button" class="remove-item" onclick="removeItem(${id})">Quitar</button></div>
  <label>Tipo de empanada</label>
  <div class="variety-choice" aria-live="polite"><svg class="variety-drawing" viewBox="0 0 64 44" role="img" aria-label="Empanada criolla"><path d="M8 30 Q32 -1 56 30 Q32 42 8 30Z" fill="#d99a45" stroke="#8b4d20" stroke-width="2.5"/><path d="M12 29 Q32 8 52 29" fill="none" stroke="#f7d69a" stroke-width="2"/><path d="M14 31l4 5 4-5 4 5 4-5 4 5 4-5 4 5 4-5 4 5 4-5" fill="none" stroke="#8b4d20" stroke-width="2"/></svg><span class="variety-description">Empanada criolla</span></div>
  <select class="item-type" onchange="toggleRaisins(${id});updateVarietyIcon(${id});updateLineLabel(${id});updatePresentationOptions(${id})">
   <option value="criolla">Criollas</option>
   <option value="arabic">Árabes</option>
  </select>
  <div class="criolla-options">
   <label>¿Qué tipo de criollas querés?</label>
   <select class="criolla-style" onchange="toggleRaisins(${id});updateLineLabel(${id})">
    <option value="savory">Saladas</option>
    <option value="sweet">Dulces</option>
   </select>
   <div class="raisin-wrap hidden"><label>¿Las dulces con o sin pasas?</label>
    <select class="item-raisin"><option value="with">Con pasas de uva</option><option value="without">Sin pasas de uva</option></select>
   </div>
  </div>
  <label>Cantidad / presentación</label>
  <div style="display:flex;gap:10px;align-items:center">
   <select class="item-presentation" style="flex:2" onchange="updateLineLabel(${id})">
    <option value="half">Media docena</option>
    <option value="dozen" selected>Docena</option>
    <option value="onehalf">Docena y media</option>
   </select>
   <input class="item-quantity" type="number" min="1" value="1" aria-label="Cantidad" style="flex:1" onchange="updateLineLabel(${id})" oninput="updateLineLabel(${id})">
  </div>
  <div class="small line-total">Subtotal de esta variedad: $18.000</div>`;
 document.getElementById("orderItems").appendChild(box);
 updatePresentationOptions(id);
 toggleRaisins(id);
}
function removeItem(id){
 const boxes=[...document.querySelectorAll("#orderItems .dozen-box")];
 if(boxes.length===1){alert("El pedido debe tener al menos una variedad.");return;}
 document.querySelector(`[data-item-id="${id}"]`)?.remove();
}
function updateVarietyIcon(id){
 const box=document.querySelector(`[data-item-id="${id}"]`);
 const type=box.querySelector(".item-type").value;
 const drawing=box.querySelector(".variety-drawing");
 const description=box.querySelector(".variety-description");
 if(type==="arabic"){
  drawing.innerHTML='<path d="M8 35 L31 5 Q34 2 37 6 L57 35 Q34 43 8 35Z" fill="#d99a45" stroke="#8b4d20" stroke-width="2.5"/><path d="M13 33 L32 10 L52 33" fill="none" stroke="#f7d69a" stroke-width="2"/><path d="M12 35 Q32 42 54 35" fill="none" stroke="#8b4d20" stroke-width="2"/>';
  drawing.setAttribute("aria-label","Empanada árabe");
  description.textContent="Empanada árabe";
 }else{
  drawing.innerHTML='<path d="M8 30 Q32 -1 56 30 Q32 42 8 30Z" fill="#d99a45" stroke="#8b4d20" stroke-width="2.5"/><path d="M12 29 Q32 8 52 29" fill="none" stroke="#f7d69a" stroke-width="2"/><path d="M14 31l4 5 4-5 4 5 4-5 4 5 4-5 4 5 4-5 4 5 4-5" fill="none" stroke="#8b4d20" stroke-width="2"/>';
  drawing.setAttribute("aria-label","Empanada criolla");
  description.textContent="Empanada criolla";
 }
}
function toggleRaisins(id){
 const box=document.querySelector(`[data-item-id="${id}"]`);
 const isSweet=box.querySelector(".item-type").value==="criolla" && box.querySelector(".criolla-style").value==="sweet";
 box.querySelector(".criolla-options").classList.toggle("hidden",box.querySelector(".item-type").value!=="criolla");
 box.querySelector(".raisin-wrap").classList.toggle("hidden",!isSweet);
}
function updatePresentationOptions(id){
 const box=document.querySelector(`[data-item-id="${id}"]`);
 const type=box.querySelector(".item-type").value;
 const select=box.querySelector(".item-presentation");
 const labels=type==="arabic"
  ? {half:"Media docena — $8.000",dozen:"Docena — $16.000",onehalf:"Docena y media — $24.000"}
  : {half:"Media docena — $9.000",dozen:"Docena — $18.000",onehalf:"Docena y media — $27.000"};
 [...select.options].forEach(option=>option.textContent=labels[option.value]);
 updateLineLabel(id);
}
function updateLineLabel(id){
 const box=document.querySelector(`[data-item-id="${id}"]`);
 const pres=box.querySelector(".item-presentation").value;
 const type=box.querySelector(".item-type").value;
 const qty=Math.max(1,parseInt(box.querySelector(".item-quantity").value||"1"));
 const unitPrice=prices[type][pres];
 box.querySelector(".line-total").textContent=`Subtotal de esta variedad: ${money(unitPrice*qty)}`;
}
function getProducts(){
 const boxes=[...document.querySelectorAll("#orderItems .dozen-box")];
 const items=boxes.map((box,i)=>{
  const baseType=box.querySelector(".item-type").value;
  const style=baseType==="criolla"?box.querySelector(".criolla-style").value:null;
  const type=baseType==="arabic"?"arabic":style;
  const presentation=box.querySelector(".item-presentation").value;
  const quantity=Math.max(1,parseInt(box.querySelector(".item-quantity").value||"1"));
  const raisin=style==="sweet"?box.querySelector(".item-raisin").value:null;
  return {label:`${presentationNames[presentation]} x ${quantity}`,type,raisin,subtotal:prices[baseType][presentation]*quantity};
 });
 return {items,subtotal:items.reduce((sum,x)=>sum+x.subtotal,0)};
}
async function fetchJsonWithTimeout(url,options={},timeoutMs=18000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const response=await fetch(url,{...options,signal:controller.signal,mode:"cors"});
  if(!response.ok)throw new Error("El servicio respondió con error "+response.status);
  return await response.json();
 }finally{clearTimeout(timer);}
}
async function geocode(address){
 // Probar más de un servicio de geocodificación para evitar que un fallo deje sin cálculo.
 const query=address.toLowerCase().includes("argentina")?address:address+", Córdoba, Argentina";
 const providers=[
  async()=>{
   const url="https://photon.komoot.io/api/?limit=5&lang=es&lat=-31.4&lon=-64.2&q="+encodeURIComponent(query);
   const data=await fetchJsonWithTimeout(url,{"Accept":"application/json"},12000);
   const features=data.features||[];
   const match=features.find(f=>{
    const p=f.properties||{};
    const place=[p.city,p.county,p.state,p.country].filter(Boolean).join(" ").toLowerCase();
    return place.includes("córdoba")||place.includes("cordoba");
   })||features[0];
   const c=match?.geometry?.coordinates;
   if(!c||c.length<2)throw new Error("Photon no encontró la dirección");
   return {lat:Number(c[1]),lon:Number(c[0])};
  },
  async()=>{
   const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=ar&addressdetails=1&q="+encodeURIComponent(query);
   const data=await fetchJsonWithTimeout(url,{"Accept":"application/json"},15000);
   const match=(data||[]).find(x=>JSON.stringify(x.address||{}).toLowerCase().includes("córdoba")||JSON.stringify(x.address||{}).toLowerCase().includes("cordoba"))||(data||[])[0];
   if(!match)throw new Error("Nominatim no encontró la dirección");
   return {lat:Number(match.lat),lon:Number(match.lon)};
  }
 ];
 let error;
 for(const provider of providers){
  try{return await provider();}catch(e){error=e;console.warn("Falló un servicio de geocodificación:",e);}
 }
 throw new Error(error?.message||"No se pudo ubicar la dirección. Revisá calle, número y barrio.");
}
async function routeKm(destination){
 const [a,b]=await Promise.all([geocode(ORIGIN),geocode(destination)]);
 const coords=`${a.lon},${a.lat};${b.lon},${b.lat}`;
 const routers=[
  `https://router.project-osrm.org/route/v1/driving/${coords}?overview=false`,
  `https://routing.openstreetmap.de/routed-car/route/v1/driving/${coords}?overview=false`
 ];
 let lastError;
 for(const url of routers){
  try{
   const data=await fetchJsonWithTimeout(url,{"Accept":"application/json"},18000);
   if(data.code==="Ok"&&data.routes?.length&&Number.isFinite(data.routes[0].distance)&&data.routes[0].distance>0){
    return data.routes[0].distance/1000;
   }
   lastError=new Error("No se encontró un recorrido en auto para esa dirección.");
  }catch(error){lastError=error;console.warn("Falló un servicio de rutas:",error);}
 }
 throw new Error(lastError?.message||"No se pudo conectar con los servicios de rutas.");
}
async function calculateOrder(){
 const name=document.getElementById("name").value.trim(),mode=document.getElementById("deliveryMode").value,address=document.getElementById("address").value.trim();
 if(!name)return alert("Por favor, ingresá tu nombre.");
 if(mode==="delivery"&&!address)return alert("Por favor, ingresá la dirección de entrega.");
 const {items,subtotal}=getProducts(); if(!items.length)return alert("Agregá al menos una variedad.");
 let shipping=0,km=null;
 const result=document.getElementById("result");result.classList.remove("hidden");result.innerHTML="⏳ Preparando tu pedido...";
 document.getElementById("whatsappBtn").classList.add("hidden");
 let shippingPending=false;
 if(mode==="delivery"){
  result.innerHTML="🚗 Calculando distancia de envío...";
  try{
   km=await routeKm(address);
   shipping=Math.max(1,Math.ceil(km/5))*1000;
  }catch(e){
   // No cobrar un importe inventado: informar el motivo y permitir confirmar el envío manualmente.
   shippingPending=true;
   console.warn("No se pudo calcular el envío:",e);
  }
 }
 const total=subtotal+shipping;
 const itemLines=items.map(x=>`• ${x.label}: ${typeText(x.type)}${x.type==="sweet"?", "+raisinText(x.raisin):""}`).join("<br>");
 const shippingLine=mode==="pickup"?`🏠 Envío: <strong>$0</strong> (sin envío)`:shippingPending?`🚚 Envío: <strong>a confirmar</strong> (no se pudo conectar al calculador de distancia)`: `🚚 Distancia por ruta: <strong>${km.toFixed(1)} km</strong><br>Envío: <strong>${money(shipping)}</strong>`;
 const totalLine=shippingPending?`💰 Subtotal de productos: <strong>${money(subtotal)}</strong><br><small>El total final se confirma al calcular el envío.</small>`:`💰 Total: <strong>${money(total)}</strong>`;
 result.innerHTML=`<strong>🧾 Resumen del pedido</strong><br><br>${itemLines}<br><br>Subtotal: <strong>${money(subtotal)}</strong><br>${shippingLine}<br><br>${totalLine}`;
 lastOrder={name,mode,address,items,subtotal,shipping,km,total,shippingPending,comments:document.getElementById("comments").value.trim()};
 document.getElementById("whatsappBtn").classList.remove("hidden");
}
function sendWhatsApp(){
 if(!lastOrder)return;const o=lastOrder;
 let t=`PEDIDO - EMPANADAS CRIOLLAS CONGELADAS\n\nNombre: ${o.name}\n\n${o.items.map(x=>`- ${x.label}: ${typeText(x.type)}${x.type==="sweet"?", "+raisinText(x.raisin):""}`).join("\n")}\n\nSubtotal: ${money(o.subtotal)}\n`;
 t+=o.mode==="delivery"?(o.shippingPending?`Envío: A CONFIRMAR (falló la conexión para calcular la distancia)\nDirección: ${o.address}\n`:`Envío: ${money(o.shipping)}\nDirección: ${o.address}\nDistancia: ${o.km.toFixed(1)} km\n`):`Sin envío / Retiro: $0\n`;
 t+=o.shippingPending?`Subtotal de productos: ${money(o.subtotal)}\nTOTAL FINAL: A CONFIRMAR CON EL ENVÍO\n`:`TOTAL: ${money(o.total)}\n`;if(o.comments)t+=`\nComentarios: ${o.comments}\n`;
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
function newOrder(){location.reload();}
toggleDelivery();addItem();
</script>
</body>
</html>
